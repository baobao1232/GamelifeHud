# HUDEngine
#
# HUD của bạn nằm trong thư mục này, cùng cấp với file này:
#
#   huds/       xác định HUD nào được sử dụng và vị trí của chúng trên màn hình
#   layouts/    các thành phần của HUD và vị trí của chúng
#   images/     định nghĩa sprite
#   texts/      định nghĩa font
#   heads/      định nghĩa đầu người chơi
#   compasses/  định nghĩa la bàn
#   points/     các điểm cố định trên la bàn
#   assets/     các file PNG mà images/ và compasses/ sử dụng
#   fonts/      các file TTF, chỉ cần khi font mặc định không có ký tự cần dùng
#   build/      kết quả biên dịch
#
# HUD Engine. HUD của bạn nằm trong thư mục này:
# huds/, layouts/, images/, texts/, heads/, compasses/, points/, assets/, fonts/.
# build/ là thư mục chứa kết quả biên dịch, tức resource pack được tạo ra.

enabled: true

# Ngôn ngữ cho thông báo trong console và trong game: en hoặc ru.
# Để thay đổi từng dòng riêng lẻ, sao chép messages/<ngôn ngữ>.yml
# từ bên trong file JAR của plugin thành messages.yml trong thư mục này
# rồi chỉ chỉnh những dòng bạn muốn thay đổi.
language: en

# Tạo HUD mẫu vào thư mục này nếu chưa có HUD nào.
#
# Tùy chọn này giúp plugin hiển thị một HUD mẫu ngay sau khi cài đặt
# thay vì màn hình trống khiến người dùng tưởng plugin bị lỗi.
# HUD mẫu chỉ được tạo khi thư mục huds/ không có gì,
# vì vậy cấu hình HUD của bạn sẽ không bị ghi đè.
# Xóa các thư mục và đặt thành false để HUD mẫu không xuất hiện lại.
starter-hud: true

# Gửi thống kê sử dụng ẩn danh tới bStats:
# phiên bản Minecraft đang sử dụng, PlaceholderAPI có được cài đặt hay không
# và số lượng HUD trong cấu hình.
# Không có thông tin nào dùng để nhận diện server hoặc người chơi.
# bStats cũng có tùy chọn tắt thống kê chung tại
# plugins/bStats/config.yml, áp dụng cho tất cả plugin cùng lúc.
metrics: true

# Ẩn các thành phần HUD mặc định của Minecraft.
# Đặt thành true để ẩn thành phần tương ứng.
#
# HUD tùy chỉnh thường tự vẽ thanh máu và thanh đói,
# trong khi HUD mặc định bên dưới sẽ khiến hai giao diện chồng lên nhau.
# Minecraft không có tùy chọn trong game để tắt chúng,
# vì vậy resource pack sẽ thay sprite của chúng bằng sprite trong suốt.
#
# Lưu ý: tùy chọn này phụ thuộc vào resource-pack.position.
# Một resource pack khác được gửi cùng lúc có thể khôi phục các thành phần này.
# Nếu các thành phần đã ẩn xuất hiện trở lại, hãy kiểm tra tùy chọn đó.
hide-vanilla-hud:
  health: false
  food: false
  armor: false
  air: false
  experience-bar: false
  hotbar: false
  crosshair: false
  effects: false
  jump-bar: false
  level-text: false

huds:
  # Những HUD mà mọi người chơi sẽ nhìn thấy khi vào server.
  # Để trống [] nghĩa là hiển thị tất cả HUD đã được biên dịch.
  default: []

  # Số tick giữa mỗi lần cập nhật HUD.
  # 1 tick = 50 ms, vì vậy 2 tick = 10 lần cập nhật mỗi giây.
  #
  # Nếu không có gì thay đổi thì plugin không gửi dữ liệu,
  # vì vậy tăng giá trị này gần như không tiết kiệm tài nguyên
  # đối với HUD chủ yếu là tĩnh.
  # Tuy nhiên các thành phần chuyển động như la bàn sẽ kém mượt hơn.
  #
  # Giá trị 1 cho độ mượt tối đa của la bàn,
  # nhưng với hơn 100 người chơi có thể tạo thêm tải cho server.
  tick-period: 2

  # Client Bedrock không thể tải Java resource pack,
  # vì vậy HUD của họ sẽ chỉ hiển thị một hàng ô trống.
  disable-for-bedrock: true

pack:
  namespace: hudengine

  description: HUDEngine resource pack

  # Phạm vi phiên bản resource pack mà resource pack được tạo ra hỗ trợ.
  # 46 là Minecraft 1.21.4, phiên bản client cũ nhất mà engine hỗ trợ chính xác.
  #
  # Một file resource pack phục vụ tất cả phiên bản trong phạm vi này:
  # shader dành cho phiên bản cũ nhất nằm ở thư mục gốc của pack,
  # các phiên bản mới hơn sẽ được thêm dưới dạng overlay
  # và client sẽ tự chọn phiên bản phù hợp.
  # Không nên thay đổi nếu không có lý do cần thu hẹp phạm vi.
  min-format: 46
  max-format: 99

  # Màu bossbar mà HUD sử dụng.
  # Resource pack sẽ làm sprite của bossbar màu này trong suốt,
  # vì vậy hãy chọn màu mà không có plugin khác sử dụng cho bossbar thật.
  boss-bar-color: yellow

  # HUD sẽ nằm trên dòng bossbar nào.
  # Để 1 nếu không có plugin khác hiển thị bossbar phía trên HUD.
  # Nếu có, tăng lên 1 cho mỗi bossbar nằm phía trên để đưa HUD về đúng vị trí.
  #
  # Thay đổi này chỉ có hiệu lực sau khi người chơi nhận resource pack mới,
  # vì vậy người chơi cần vào lại server.
  # Tọa độ của các thành phần HUD không cần thay đổi.
  boss-bar-line: 1

  # Các ký tự được thêm vào mọi font ngoài những ngôn ngữ mà font đã khai báo.
  # Dùng cho các ký hiệu không thuộc một hệ chữ cụ thể, ví dụ: "⚔✦❤"
  extra-chars: ""

  # Nơi lưu resource pack.
  # Để trống sẽ sử dụng build/HUDEngine.zip.
  # Có thể trỏ trực tiếp tới thư mục của web server để phân phối resource pack.
  output: ""

  # Đồng thời ghi resource pack dưới dạng thư mục đã giải nén để kiểm tra.
  # Mặc định tắt vì sẽ tăng gấp đôi lượng dữ liệu ghi mỗi lần reload.
  write-tree: false

  # Tạo build/manifest.json mô tả những gì đã được biên dịch.
  # Hữu ích khi cần tìm key của các thành phần để sử dụng với API.
  write-manifest: true

resource-pack:
  # Cách resource pack đã tạo được gửi tới người chơi.
  #
  #   none  chỉ tạo file rồi dừng, vì bạn tự phân phối resource pack
  #   url   resource pack đã được đăng tải ở đâu đó, gửi địa chỉ đó cho người chơi
  #   host  chạy một HTTP server nhỏ ngay tại đây để phân phối resource pack
  delivery: none

  # Địa chỉ chứa resource pack, dùng khi delivery: url.
  url: ""

  host:
    # Địa chỉ mà HTTP server sẽ lắng nghe.
    # 0.0.0.0 nghĩa là lắng nghe trên tất cả network interface.
    bind: "0.0.0.0"
    port: 8123
    path: "/hudengine.zip"

    # Địa chỉ mà người chơi sẽ tải resource pack.
    # Đây chính là địa chỉ được gửi tới client,
    # vì vậy phải có thể truy cập từ Internet:
    # IP public hoặc domain của server, KHÔNG phải localhost.
    # Việc port forwarding phải được tự cấu hình.
    public-url: "http://your-server-ip:8123/hudengine.zip"

  # Gửi resource pack khi người chơi vào server.
  # Tắt tùy chọn này nếu muốn tự gửi resource pack vào thời điểm khác thông qua API.
  send-on-join: true

  # Kick người chơi nếu họ từ chối hoặc không thể tải resource pack.
  # Mặc định tắt.
  required: false

  # Nội dung hiển thị trong cửa sổ yêu cầu chấp nhận resource pack.
  # Để trống sẽ sử dụng nội dung mặc định của client.
  prompt: ""

  # Nội dung hiển thị khi kick người chơi nếu required được bật.
  # Để trống sẽ sử dụng thông báo tích hợp theo ngôn ngữ đã cấu hình.
  kick-message: ""

  # Các resource pack khác được gửi cùng request.
  #
  # Từ Minecraft 1.20.3, client sẽ xếp chồng các resource pack
  # thay vì thay thế pack trước đó.
  # Vì vậy server có texture riêng không cần gộp pack,
  # chỉ cần liệt kê chúng ở đây và người chơi sẽ thấy một cửa sổ yêu cầu duy nhất.
  #
  # Resource pack của HUDEngine luôn được gửi cuối cùng
  # để shader của HUDEngine không bị pack khác ghi đè.
  #
  # extra-packs:
  #   - url: "https://example.com/my-textures.zip"
  #     hash: "0123456789abcdef0123456789abcdef01234567"
  extra-packs: []

  # Vị trí của resource pack này trong danh sách các pack được gửi:
  # last hoặc first.
  #
  # Điều này quan trọng vì HUD hoạt động bằng cách thay thế
  # các file mà client đã có sẵn.
  #
  # HUD làm sprite của bossbar mà nó sử dụng trở nên trong suốt
  # và thay thế hoàn toàn text shader.
  #
  # Nếu một resource pack khác cũng chỉnh sửa một trong hai thành phần này,
  # pack nào thắng sẽ phụ thuộc hoàn toàn vào thứ tự.
  #
  # Các dấu hiệu cụ thể:
  #
  #   xuất hiện thanh màu vàng ở phía trên màn hình
  #       -> pack khác đã khôi phục sprite của bossbar;
  #          hãy chuyển pack này sang phía có độ ưu tiên cao hơn
  #
  #   HUD hoàn toàn không xuất hiện
  #       -> pack khác đã thay thế text shader
  #
  # Thứ tự ưu tiên chính xác đối với resource pack do server gửi
  # không được Minecraft tài liệu hóa rõ ràng.
  # Nếu không chắc, hãy thử cả hai:
  # chỉ cần cho người chơi vào lại một lần để kiểm tra,
  # và kết quả sẽ không thay đổi.
  position: last

skins:
  # Tải skin người chơi để sử dụng cho các thành phần hiển thị đầu.
  # Nếu tắt, tất cả đầu sẽ sử dụng khuôn mặt mặc định được tích hợp sẵn.
  enabled: true
  timeout-seconds: 5

compass:
  # Tính cả độ cao vào khoảng cách tới điểm trên la bàn.
  # Nếu tắt, một điểm cách bạn 100 block theo chiều cao
  # nhưng có cùng X và Z sẽ được tính như đang cách 0 block.
  height-aware: false

  # Tính bán kính của điểm theo chiều ngang thay vì không gian 3 chiều.
  # true = chỉ tính X và Z.
  # false = tính cả X, Y và Z.
  flat-radius: true

# Thanh máu trên đầu player và mob. Hiện khi người chơi gây sát thương, ẩn sau show-seconds.
# Cần ít nhất một file trong mobbars/ (xem starter HUD).
mob-bars:
  enabled: true
  bar: health        # key trong mobbars/; không có thì tự hiện chữ ❤ hp/max
  text-only: false   # true = luôn hiện chữ, kể cả khi đã có PNG (để thử)
  look: true         # nhìn vào mob là hiện, không cần đánh
  mobs: true
  players: true
  show-seconds: 3
  blacklist:
    - ARMOR_STAND
