name: GamelifeHUD
version: '${project.version}'
main: io.github.nacvark.hudengine.paper.HudEnginePlugin
api-version: '1.21'
authors: [Gamelife Studio]
description: Hệ thống HUD phía máy chủ, biên dịch cấu hình thành resource pack và hiển thị thông qua thanh bossbar.
website: https://github.com/Nacvark/HUDEngine
folia-supported: true

softdepend: [PlaceholderAPI]

commands:
  hudengine:
    description: Quản lý HUD của người chơi
    usage: /hudengine toggle [player] | show <hud> [player] | hide <hud> [player] | reset [player] | list [player] | reload
    aliases: [hud]

permissions:
  hudengine.*:
    description: Toàn bộ quyền của GamelifeHUD
    default: op
    children:
      hudengine.admin: true
      hudengine.command.*: true

  hudengine.admin:
    description: Tải lại cấu hình và quản lý HUD của người chơi khác
    default: op
    children:
      hudengine.command.reload: true
      hudengine.command.others: true

  hudengine.command.*:
    description: Toàn bộ lệnh của GamelifeHUD
    default: op
    children:
      hudengine.command.toggle: true
      hudengine.command.show: true
      hudengine.command.hide: true
      hudengine.command.reset: true
      hudengine.command.list: true
      hudengine.command.reload: true
      hudengine.command.others: true

  hudengine.command.toggle:
    description: Bật hoặc tắt HUD của bạn
    default: op

  hudengine.command.show:
    description: Hiển thị một HUD cụ thể cho bạn
    default: op

  hudengine.command.hide:
    description: Ẩn một HUD cụ thể của bạn
    default: op

  hudengine.command.reset:
    description: Khôi phục danh sách HUD mặc định của bạn
    default: op

  hudengine.command.list:
    description: Hiển thị danh sách các HUD đã biên dịch
    default: op

  hudengine.command.reload:
    description: Biên dịch lại cấu hình HUD
    default: op

  hudengine.command.others:
    description: Quản lý HUD của người chơi khác
    default: op
