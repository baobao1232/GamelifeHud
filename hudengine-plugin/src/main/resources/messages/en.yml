# HUDEngine messages, Vietnamese.
#
# Sao chép file này thành messages.yml trong thư mục plugin
# để ghi đè các nội dung bên dưới.
# Những dòng không khai báo sẽ tự động sử dụng nội dung mặc định.
#
# Màu sắc được sử dụng tối giản: prefix, các từ thể hiện trạng thái
# và thông báo lỗi. Những phần còn lại giữ màu trắng để dễ nhìn.
#
# Định dạng sử dụng mã màu cũ:
# &a xanh lá, &f trắng, &c đỏ, &e vàng, &7 xám.
# Các giá trị trong dấu ngoặc nhọn sẽ được plugin tự động điền.

prefix: "&a[GamelifeHUD]&f "

