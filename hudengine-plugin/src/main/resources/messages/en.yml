  skins-offline: "Người chơi tại đây không có dữ liệu skin. Các phần đầu sẽ sử dụng khuôn mặt mặc định."
  shadow-unsupported: "Server này không hỗ trợ điều khiển đổ bóng riêng cho từng thành phần (client 1.21.4), vì vậy hình ảnh và phần đầu trong HUD sẽ sử dụng đổ bóng chữ mặc định của Minecraft."
